name: Progresión de Jessi con revisión

on:
  # El piloto requiere aprobación de Hugo; no hay disparo semanal automático.
  workflow_dispatch:
    inputs:
      mode:
        description: 'Simular, aplicar una semana o establecer la línea base sin cambiar cargas'
        type: choice
        options: [preview, apply, baseline]
        default: preview
      allow_started:
        description: 'Hugo autorizó actualizar una semana que ya comenzó'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: jessi-weekly-progression
  cancel-in-progress: false

jobs:
  progress:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar comportamiento
        run: node --test tests/*.test.mjs
      - name: Actualizar y verificar Firebase
        env:
          FIREBASE_PROJECT_ID: asesoriasjessi
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          RUN_MODE: ${{ inputs.mode }}
          ALLOW_STARTED: ${{ inputs.allow_started }}
        run: |
          case "$RUN_MODE" in
            preview) node scripts/weekly-progression.mjs ;;
            baseline) node scripts/weekly-progression.mjs --baseline --apply ;;
            apply)
              if [ "$ALLOW_STARTED" = 'true' ]; then
                node scripts/weekly-progression.mjs --apply --allow-started
              else
                node scripts/weekly-progression.mjs --apply
              fi
              ;;
            *) exit 1 ;;
          esac
