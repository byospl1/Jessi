name: Progresión anterior de Jessi — solo simulación

on:
  # La aplicación de la regla antigua queda deshabilitada durante el piloto adaptativo.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jessi-weekly-progression
  cancel-in-progress: false

jobs:
  progress:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar comportamiento
        run: node --test tests/*.test.mjs
      - name: Simular sin escribir en Firebase
        env:
          FIREBASE_PROJECT_ID: asesoriasjessi
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: node scripts/weekly-progression.mjs
